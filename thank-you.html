<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BackTick - Message Sent!</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            background-color: #131419;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #eee;
        }

        .thank-you-box {
            text-align: center;
            padding: 60px 40px;
            max-width: 480px;
        }

        .icon-circle {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background-color: rgba(65, 105, 225, 0.15);
            border: 2px solid royalblue;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 28px;
        }

        .icon-circle i {
            font-size: 2.4em;
            color: royalblue;
        }

        h1 {
            font-size: 2em;
            color: #fff;
            margin-bottom: 14px;
        }

        p {
            color: rgb(170, 168, 168);
            line-height: 1.7;
            margin-bottom: 36px;
            font-size: 0.97em;
        }

        .btn-home {
            display: inline-block;
            padding: 0.85em 2em;
            background-color: royalblue;
            color: #fff;
            text-decoration: none;
            border-radius: 2em;
            font-size: 0.95em;
            letter-spacing: 1px;
            transition: background-color 0.3s;
        }

        .btn-home:hover {
            background-color: #2244cc;
        }
    </style>
</head>

<body>
    <div class="thank-you-box">
        <div class="icon-circle">
            <i class="fa fa-check"></i>
        </div>
        <h1>Message Sent!</h1>
        <p>
            Thanks for reaching out. The message has been received and a reply will be sent as soon as possible.
        </p>
        <a href="./index.html" class="btn-home">
            <i class="fa fa-home"></i> &nbsp; Back to Home
        </a>
    </div>
</body>

</html>
